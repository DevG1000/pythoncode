repos:
  # 代码格式化
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.9

  # 导入排序
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # 代码检查
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=127", "--extend-ignore=E203,W503"]

  # 类型检查
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports", "--show-error-codes"]
        additional_dependencies: [types-requests]

  # 安全检查
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]

  # 文件结尾检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-ast
      - id: check-toml
      - id: check-json

  # 提交信息检查
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.17.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  # 测试文件检查
  - repo: https://github.com/pre-commit/mirrors-pytest
    rev: v8.3.4
    hooks:
      - id: pytest-check
        args: ["tests/", "-xvs"]

  # 依赖安全检查
  - repo: local
    hooks:
      - id: safety-check
        name: Safety dependency check
        entry: safety
        language: system
        args: ["check", "-r", "requirements.txt"]
        pass_filenames: false
        stages: [push]

  # 容器安全扫描
  - repo: local
    hooks:
      - id: trivy-scan
        name: Trivy container scan
        entry: trivy
        language: system
        args: ["image", "--severity", "HIGH,CRITICAL", "--exit-code", "1", "pythoncode:latest"]
        pass_filenames: false
        stages: [push]
        files: ^config/Dockerfile$

# 全局配置
default_language_version:
  python: python3.9

default_stages: [commit, push]

# 排除文件
exclude: |
  (?x)^(
    .*\.min\.js$|
    .*\.min\.css$|
    .*\.map$|
    .*\.svg$|
    .*\.ico$|
    .*\.png$|
    .*\.jpg$|
    .*\.jpeg$|
    .*\.gif$|
    .*\.pdf$|
    .*\.zip$|
    .*\.tar\.gz$|
    .*\.pyc$|
    __pycache__/|
    \.git/|
    \.venv/|
    venv/|
    node_modules/|
    dist/|
    build/|
    \.eggs/|
    \.tox/|
    \.pytest_cache/|
    \.mypy_cache/|
    \.coverage|
    htmlcov/|
    \.benchmarks/
  )$