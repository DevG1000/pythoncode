# Staging Environment Configuration
# This environment is used for testing and quality assurance before production deployment

name: staging
description: "Staging environment for testing and QA"
url: "https://staging.pythoncode.com"

# Deployment settings
deployment_branch_policy:
  protected_branches: true
  custom_branch_policies: false
  allowed_branches:
    - "develop"
    - "release/**"

# Reviewers required for deployment to this environment
reviewers:
  - "qa-team"
  - "dev-lead"
  - "team-leads"

# Required checks that must pass before deployment
required_checks:
  - "code-quality"
  - "security-scan"
  - "test-coverage"
  - "integration-tests"
  - "docker-build"

# Environment variables
# These are set as environment secrets in GitHub
variables:
  ENVIRONMENT: "staging"
  DEPLOYMENT_TYPE: "staging"
  
  # API configuration
  API_URL: "https://staging-api.pythoncode.com"
  API_PORT: "8080"
  
  # Database configuration
  DATABASE_TYPE: "postgresql"
  DATABASE_HOST: "staging-db.pythoncode.com"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "pythoncode_staging"
  
  # Redis configuration
  REDIS_HOST: "staging-redis.pythoncode.com"
  REDIS_PORT: "6379"
  
  # Logging configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  # Monitoring configuration
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  
  # Feature flags
  FEATURE_NEW_API: "false"
  FEATURE_EXPERIMENTAL: "true"

# Secrets required for this environment
# These must be set in GitHub Secrets
secrets:
  - "STAGING_API_KEY"
  - "STAGING_DB_PASSWORD"
  - "STAGING_REDIS_PASSWORD"
  - "STAGING_JWT_SECRET"
  - "STAGING_ENCRYPTION_KEY"

# Resource configuration
resources:
  # CPU and memory limits
  limits:
    cpu: "2"
    memory: "4Gi"
  
  # Storage requirements
  storage:
    database: "50Gi"
    logs: "10Gi"
    backups: "100Gi"
  
  # Network configuration
  network:
    internal_port: 8080
    external_port: 80
    ssl_enabled: true
    cors_allowed_origins:
      - "https://staging.pythoncode.com"
      - "https://staging-api.pythoncode.com"

# Monitoring and alerts
monitoring:
  # Health check endpoints
  health_checks:
    - endpoint: "/health"
      interval: "30s"
      timeout: "5s"
    
    - endpoint: "/ready"
      interval: "30s"
      timeout: "5s"
  
  # Metrics to collect
  metrics:
    - "cpu_usage"
    - "memory_usage"
    - "request_latency"
    - "error_rate"
    - "throughput"
  
  # Alert thresholds
  alerts:
    - metric: "cpu_usage"
      threshold: "80%"
      duration: "5m"
      severity: "warning"
    
    - metric: "memory_usage"
      threshold: "85%"
      duration: "5m"
      severity: "warning"
    
    - metric: "error_rate"
      threshold: "5%"
      duration: "2m"
      severity: "critical"
    
    - metric: "request_latency_p95"
      threshold: "1000ms"
      duration: "5m"
      severity: "warning"

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "30 days"
  locations:
    - "s3://pythoncode-backups/staging"
  
  # What to backup
  include:
    - "database"
    - "configuration"
    - "logs"
  
  exclude:
    - "cache"
    - "temp_files"

# Testing configuration
testing:
  # Automated tests to run in this environment
  automated_tests:
    - "integration"
    - "performance"
    - "security"
    - "load"
  
  # Manual testing requirements
  manual_tests:
    - "user_acceptance"
    - "exploratory"
    - "usability"
  
  # Test data
  test_data:
    source: "production_snapshot"
    anonymize: true
    size: "medium"

# Rollback configuration
rollback:
  enabled: true
  automatic: false  # Manual approval required
  retention: "5 deployments"
  strategy: "blue-green"

# Access control
access:
  # Who can deploy to this environment
  deployers:
    teams:
      - "devops"
      - "backend"
      - "team-leads"
    
    users:
      - "ci-bot"
  
  # Who can access the environment
  viewers:
    teams:
      - "qa"
      - "backend"
      - "frontend"
      - "team-leads"
    
    users:
      - "staging-monitor"
  
  # SSH access (if applicable)
  ssh_access:
    enabled: false
    allowed_ips:
      - "10.0.0.0/8"
      - "192.168.0.0/16"

# Maintenance windows
maintenance:
  schedule:
    - day: "sunday"
      time: "02:00-04:00"
      description: "Weekly maintenance"
    
    - day: "first monday of month"
      time: "01:00-03:00"
      description: "Monthly updates"
  
  notifications:
    - channel: "slack#staging"
      before: "24h"
      during: true
      after: true

# Cost management
cost:
  budget: 500  # Monthly budget in USD
  alert_threshold: 80%  # Alert when 80% of budget is used
  tracking_enabled: true
  tags:
    environment: "staging"
    project: "pythoncode"
    team: "devops"

# Compliance requirements
compliance:
  standards:
    - "ISO-27001"
    - "SOC-2"
    - "GDPR"
  
  requirements:
    - "data_encryption_at_rest"
    - "data_encryption_in_transit"
    - "access_logging"
    - "audit_trail"
  
  audit:
    frequency: "quarterly"
    retention: "7 years"

# Integration with other systems
integrations:
  # CI/CD integration
  ci_cd:
    provider: "github-actions"
    workflow: "deploy-staging"
    triggers:
      - "push_to_develop"
      - "manual_dispatch"
  
  # Monitoring integration
  monitoring:
    provider: "prometheus"
    url: "https://monitoring.pythoncode.com"
    dashboard: "staging"
  
  # Logging integration
  logging:
    provider: "elasticsearch"
    url: "https://logs.pythoncode.com"
    index: "pythoncode-staging-*"
  
  # Alerting integration
  alerting:
    provider: "pagerduty"
    service: "pythoncode-staging"
    escalation_policy: "devops-team"

# Documentation links
documentation:
  setup_guide: "https://docs.pythoncode.com/environments/staging/setup"
  troubleshooting: "https://docs.pythoncode.com/environments/staging/troubleshooting"
  api_docs: "https://staging-api.pythoncode.com/docs"
  monitoring_dashboard: "https://grafana.pythoncode.com/d/staging"

# Notes and comments
notes: |
  This is the staging environment for PythonCode.
  It should closely mirror production but with test data.
  
  Important:
  - Never use real production data
  - All data should be anonymized
  - Performance testing should be done here
  - Security scanning is mandatory
  
  Contact the DevOps team for access or issues.