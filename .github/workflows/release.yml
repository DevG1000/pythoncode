name: Release Pipeline

on:
  push:
    tags:
      - 'v*'  # 推送版本标签时触发

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Get version from tag
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          git log --oneline --no-merges $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD > CHANGELOG.md
          echo "## Release ${{ steps.get_version.outputs.VERSION }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Changes since last release:" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          cat CHANGELOG.md >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            requirements.txt
            config/docker-compose.yml
            config/Dockerfile

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/pythoncode
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./config/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-production:
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Deploy to production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          ssh -o StrictHostKeyChecking=no -i private_key ${PRODUCTION_USER}@${PRODUCTION_HOST} "
            cd /opt/pythoncode &&
            git fetch --tags &&
            git checkout ${{ steps.get_version.outputs.VERSION }} &&
            cd config &&
            docker-compose down &&
            docker-compose pull &&
            docker-compose up -d --build &&
            echo 'Deployed version ${{ steps.get_version.outputs.VERSION }} successfully'
          "

  notify-release:
    runs-on: ubuntu-latest
    needs: deploy-to-production
    if: always()
    steps:
      - name: Send release notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#releases'
          username: 'Release Bot'
          text: |
            ${{ github.event.repository.name }} v${{ steps.get_version.outputs.VERSION_NUMBER }} has been released!
            
            Release Notes: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.VERSION }}
            
            Docker Image: ${{ secrets.DOCKER_USERNAME }}/pythoncode:${{ steps.get_version.outputs.VERSION_NUMBER }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}