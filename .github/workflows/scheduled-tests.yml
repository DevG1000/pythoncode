name: Scheduled Tests

on:
  schedule:
    # 每天凌晨2点运行
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  nightly-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-benchmark

      - name: Run comprehensive test suite
        run: |
          python -m pytest tests/ -v \
            --cov=api --cov=command_system --cov=card_generator --cov=utils \
            --cov-report=xml --cov-report=html \
            --junitxml=test-results.xml

      - name: Run performance benchmarks
        run: |
          python -m pytest tests/ -v --benchmark-only --benchmark-autosave

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
            .benchmarks/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: nightly

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-results.json || true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: |
            trivy-results.sarif
            bandit-results.json

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Check for outdated dependencies
        run: |
          pip install pip-review
          pip-review --local --verbose

      - name: Check for security vulnerabilities
        run: |
          pip install safety
          safety check -r requirements.txt --full-report

      - name: Generate dependency report
        run: |
          pip freeze > requirements-frozen.txt
          pip list --outdated --format=json > outdated-deps.json

      - name: Upload dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            requirements-frozen.txt
            outdated-deps.json

  notify-results:
    runs-on: ubuntu-latest
    needs: [nightly-tests, security-scan, dependency-audit]
    if: always()
    steps:
      - name: Check test results
        id: check-tests
        run: |
          if [ -f test-results.xml ]; then
            echo "TEST_RESULTS=available" >> $GITHUB_OUTPUT
          else
            echo "TEST_RESULTS=unavailable" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#nightly-tests'
          username: 'Nightly Test Bot'
          text: |
            Nightly tests completed for ${{ github.repository }}
            
            Status: ${{ job.status }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
            
            View results: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Artifacts available: ${{ steps.check-tests.outputs.TEST_RESULTS }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}