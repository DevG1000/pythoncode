name: Staging Deployment Test

"on":
  workflow_dispatch:  # Allow manual trigger only
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/staging-deployment-test.yml'
      - 'scripts/deploy_staging.py'
      - 'scripts/verify_staging_deployment.py'

# Environment variables
env:
  PYTHON_VERSION: '3.9'

# Default job configuration
defaults:
  run:
    shell: bash

jobs:
  # Direct staging deployment test
  deploy-staging-test:
    name: Deploy to Staging (Test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      API_URL: ${{ vars.API_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
      STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Display environment info
        run: |
          echo "=== Staging Deployment Test Environment ==="
          echo "Environment: $ENVIRONMENT"
          echo "Log Level: $LOG_LEVEL"
          echo "API URL: $API_URL"
          echo "Database URL: $(if [ -n \"$STAGING_DATABASE_URL\" ]; then echo '[OK] Set'; else echo '[FAIL] Not set'; fi)"
          echo "Redis URL: $(if [ -n \"$STAGING_REDIS_URL\" ]; then echo '[OK] Set'; else echo '[FAIL] Not set'; fi)"
          echo "API Key: $(if [ -n \"$STAGING_API_KEY\" ]; then echo '[OK] Set'; else echo '[FAIL] Not set'; fi)"

      - name: Validate environment configuration
        run: |
          if [ -z "$ENVIRONMENT" ] || [ -z "$LOG_LEVEL" ] || [ -z "$API_URL" ]; then
            echo "[FAIL] Required environment variables are missing"
            exit 1
          fi
          if [ -z "$STAGING_DATABASE_URL" ] || [ -z "$STAGING_REDIS_URL" ] || [ -z "$STAGING_API_KEY" ]; then
            echo "[WARN] Some environment secrets are missing (continuing with test)"
          fi
          echo "[OK] Environment configuration validated"

      - name: Run staging deployment script (dry run)
        run: |
          echo "Running staging deployment dry run..."
          python scripts/deploy_staging.py --dry-run --verbose

      - name: Verify deployment artifacts
        run: |
          echo "Checking deployment artifacts..."
          if [ -f ".env.staging" ]; then
            echo "[OK] .env.staging file created"
            echo "First 10 lines of .env.staging:"
            head -10 .env.staging
          else
            echo "[FAIL] .env.staging file not created"
          fi
          
          if [ -f "deployment-summary.json" ]; then
            echo "[OK] deployment-summary.json file created"
            echo "Deployment summary:"
            cat deployment-summary.json | python -m json.tool | head -20
          else
            echo "[FAIL] deployment-summary.json file not created"
          fi

      - name: Run deployment verification (dry run)
        run: |
          echo "Running deployment verification..."
          python scripts/verify_staging_deployment.py --dry-run --verbose || echo "[WARN] Verification completed with warnings"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-test-artifacts
          path: |
            .env.staging
            deployment-summary.json
            staging-verification-report.json
          retention-days: 7

      - name: Test summary
        run: |
          echo "=== Staging Deployment Test Summary ==="
          echo "Test completed at: $(date)"
          echo "Environment: $ENVIRONMENT"
          if [ -f "deployment-summary.json" ]; then
            echo "Status: Deployment simulation successful"
            echo "Artifacts created: .env.staging, deployment-summary.json"
          else
            echo "Status: Deployment simulation failed or incomplete"
          fi
          echo "======================================"

# Workflow permissions
permissions:
  contents: read
  deployments: write