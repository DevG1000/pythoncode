name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Auto-assign issue
        if: github.event_name == 'issues'
        uses: pozil/auto-assign-issue@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: ${{ github.event.issue.user.login }}
          numOfAssignee: 1

      - name: Auto-assign PR
        if: github.event_name == 'pull_request'
        uses: pozil/auto-assign-issue@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: ${{ github.event.pull_request.user.login }}
          numOfAssignee: 1

      - name: Add labels based on title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue?.title || context.payload.pull_request?.title || '';
            const labels = [];
            
            // 根据标题关键词添加标签
            if (title.includes('[BUG]') || title.includes('bug') || title.includes('错误')) {
              labels.push('bug');
            }
            if (title.includes('[FEATURE]') || title.includes('feature') || title.includes('功能')) {
              labels.push('enhancement');
            }
            if (title.includes('[SECURITY]') || title.includes('security') || title.includes('安全')) {
              labels.push('security');
            }
            if (title.includes('[DOCS]') || title.includes('docs') || title.includes('文档')) {
              labels.push('documentation');
            }
            if (title.includes('[TEST]') || title.includes('test') || title.includes('测试')) {
              labels.push('test');
            }
            if (title.includes('[CI/CD]') || title.includes('ci/cd') || title.includes('部署')) {
              labels.push('ci-cd');
            }
            
            // 如果没有匹配到特定标签，添加默认标签
            if (labels.length === 0) {
              labels.push('triage');
            }
            
            // 添加标签
            if (context.payload.issue) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            } else if (context.payload.pull_request) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });
            }