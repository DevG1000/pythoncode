# Staging Configuration
# This file contains staging environment settings.

app:
  environment: "staging"
  debug: false
  # secret_key should be set via environment variable SECRET_KEY

database:
  url: "postgresql://user:password@localhost/pythoncode_staging"
  pool_size: 15
  max_overflow: 30
  pool_recycle: 1800
  echo: false

email:
  # Use test email service in staging
  server: "smtp.mailtrap.io"
  port: 2525
  use_tls: true
  # Credentials should be set via environment variables

command_system:
  timeout: 20
  max_workers: 8
  max_queue_size: 150
  enable_validation: true
  log_level: "INFO"
  enable_monitoring: true
  monitor_interval: 45

logging:
  level: "INFO"
  file: "/var/log/pythoncode/staging.log"
  max_size_mb: 50
  backup_count: 7

api:
  host: "0.0.0.0"
  port: 5000
  workers: 6
  cors_origins:
    - "https://staging.yourdomain.com"
    - "http://localhost:3000"
  rate_limit: "500 per minute"
  enable_swagger: true

cache:
  type: "redis"
  redis_url: "redis://localhost:6379/1"
  default_timeout: 300

performance:
  max_request_size_mb: 16
  request_timeout_seconds: 45
  enable_compression: true
  enable_caching: true
  cache_ttl_seconds: 300

security:
  enable_cors: true
  enable_rate_limiting: true
  enable_input_sanitization: true
  enable_output_encoding: true
  max_file_size_mb: 10