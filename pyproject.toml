[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythoncode"
version = "1.0.0"
description = "Python项目 - 包含名片生成、用户API和CMD代理"
readme = "README.md"
authors = [
    {name = "PythonCode Team", email = "pythoncode@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["python", "flask", "api", "cmd", "business-card"]
dependencies = [
    "Flask>=3.1.3",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Mail>=0.10.0",
    "Flask-CORS>=6.0.2",
    "bcrypt>=4.1.2",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.2.0",
    "requests>=2.32.5",
    "psutil>=6.0.0",
    "openpyxl>=3.1.5",
    "pillow>=12.1.1",
    "redis>=5.2.1",
    "redis-py-cluster>=2.1.3",
    "hiredis>=2.3.3",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=24.10.0",
    "flake8>=7.1.1",
    "isort>=5.13.2",
    "mypy>=1.11.2",
    "bandit>=1.7.10",
    "safety>=2.4.1",
    "pre-commit>=3.7.1",
]
docs = [
    "sphinx>=7.3.7",
    "sphinx-rtd-theme>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/your-username/pythoncode"
Repository = "https://github.com/your-username/pythoncode"
Documentation = "https://pythoncode.readthedocs.io/"
Issues = "https://github.com/your-username/pythoncode/issues"
Changelog = "https://github.com/your-username/pythoncode/releases"

[tool.black]
line-length = 127
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "api: marks tests as API tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["api", "command_system", "card_generator", "utils"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "docs", ".venv", "venv"]
skips = ["B101", "B104"]

[tool.safety]
ignore = [
    "51457",  # pillow CVE (false positive)
    "44715",  # requests CVE (false positive)
]

[project.scripts]
pythoncode-api = "api.app:main"
pythoncode-cmd = "command_system.cmd_agent:main"
pythoncode-card = "card_generator.Line2Card:main"
pythoncode-arch-agent = "architecture_agent:main"