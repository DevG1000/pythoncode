# Nginx配置文件
# 用于Python项目的反向代理和负载均衡

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # 基础设置
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # 压缩设置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml image/svg+xml;
    
    # 上游服务器配置（负载均衡）
    upstream flask_app {
        # 负载均衡算法：least_conn（最少连接）
        least_conn;
        
        # API服务器实例
        server api:5000 max_fails=3 fail_timeout=30s;
        
        # 可以添加更多实例用于扩展
        # server api2:5000 max_fails=3 fail_timeout=30s;
        # server api3:5000 max_fails=3 fail_timeout=30s;
        
        # 健康检查
        keepalive 32;
    }
    
    # HTTP服务器配置（重定向到HTTPS）
    server {
        listen 80;
        server_name localhost;
        
        # 重定向到HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    # HTTPS服务器配置
    server {
        listen 443 ssl http2;
        server_name localhost;
        
        # SSL证书配置
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        # SSL优化
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        
        # 根路径 - 显示欢迎页面
        location = / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head>
    <title>Python项目API服务</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #333; }
        .endpoint { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        code { background: #eee; padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Python项目API服务</h1>
        <p>欢迎使用Python项目API服务，这是一个集成了名片生成、用户管理和CMD代理的多功能平台。</p>
        
        <h2>📋 可用端点</h2>
        <div class="endpoint">
            <strong>健康检查:</strong> <code>GET /api/health</code>
            <p>检查服务状态和数据库连接</p>
        </div>
        
        <div class="endpoint">
            <strong>用户注册:</strong> <code>POST /api/register</code>
            <p>新用户注册和邮箱验证</p>
        </div>
        
        <div class="endpoint">
            <strong>性能监控:</strong> <code>GET /api/performance</code>
            <p>查看系统性能信息</p>
        </div>
        
        <div class="endpoint">
            <strong>内存优化:</strong> <code>POST /api/memory/optimize</code>
            <p>手动触发内存优化</p>
        </div>
        
        <h2>🔧 管理功能</h2>
        <ul>
            <li><strong>并发控制:</strong> 支持7个并发命令执行</li>
            <li><strong>超时管理:</strong> 15秒自动超时保护</li>
            <li><strong>内存优化:</strong> 自动内存监控和清理</li>
            <li><strong>异步任务:</strong> 后台任务处理系统</li>
        </ul>
        
        <h2>📊 状态信息</h2>
        <p>服务状态: <span style="color: green;">● 运行中</span></p>
        <p>API版本: 1.0.0</p>
        <p>更新时间: 2024-01-15</p>
        
        <footer>
            <p style="margin-top: 40px; color: #666; font-size: 0.9em;">
                © 2024 Python项目 - 基于Docker容器化部署
            </p>
        </footer>
    </div>
</body>
</html>';
        }
        
        # API端点 - 代理到Flask应用
        location /api/ {
            # 代理设置
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # 重试机制
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            
            # CORS支持
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
            
            # 预检请求处理
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
        }
        
        # 静态文件服务
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # 安全头
            add_header X-Content-Type-Options "nosniff";
            add_header X-Frame-Options "SAMEORIGIN";
        }
        
        # 文件上传下载
        location /uploads/ {
            alias /app/uploads/;
            client_max_body_size 100M;
            
            # 安全限制
            limit_except GET {
                deny all;
            }
        }
        
        # 健康检查端点（直接访问，不经过负载均衡）
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status": "healthy", "service": "nginx", "timestamp": "$time_iso8601"}';
        }
        
        # Nginx状态页面（需要nginx-module-http-stub-status）
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
        
        # 错误页面
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
    
    # 监控服务器配置（可选）
    server {
        listen 8080;
        server_name monitor.localhost;
        
        location / {
            # 代理到监控服务
            proxy_pass http://monitor:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}